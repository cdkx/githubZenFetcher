services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: phrases
      POSTGRES_USER: phrases
      POSTGRES_PASSWORD: phrases
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U phrases -d phrases" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zen-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-zen-fetcher
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: phrases
      DB_USERNAME: phrases
      DB_PASSWORD: phrases
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zen-network

volumes:
  postgres_data:

networks:
  zen-network:
    driver: bridge