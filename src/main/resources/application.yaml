spring:
  application:
    name: github-zen-fetcher

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:phrases}
    username: ${DB_USERNAME:phrases}
    password: ${DB_PASSWORD:phrases}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true

github:
  token: ${GITHUB_TOKEN}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always

logging:
  level:
    ru.eremin: INFO
    liquibase: INFO
    org.springframework.web: INFO
    org.hibernate.tool.schema: INFO
    org.springframework.boot.liquibase: INFO